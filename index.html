<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Bodo Braegger" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logos/favicon/favicon.ico" type="image/x-icon" />
    <meta name="msapplication-TileColor" content="#FFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <title>Bodo Braegger</title>
    <!-- The two faces that paint above the fold on every page: body serif and
         the mono nav and headings. Other faces load on demand and swap in over
         metric-matched fallbacks (see src/styles/fonts.css). -->
    <link rel="preload" href="/src/assets/fonts/BradfordLL-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/BradfordMonoLL-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <!-- The chat widget itself is loaded on first interaction, see src/lib/chat-widget.ts -->
    <link rel="dns-prefetch" href="//st.chatango.com" />
  </head>
  <body class="font-serif text-gray-800 dark:text-gray-100 relative">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
