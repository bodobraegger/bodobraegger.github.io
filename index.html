<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Bodo Braegger" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="/logos/favicon/favicon.ico" type="image/x-icon" />
    <meta name="msapplication-TileColor" content="#FFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <title>Bodo Braegger</title>
    <!-- The two faces that paint above the fold on every page: the body text
         and the navigation. The headings sit a little lower, so their semi mono
         loads on demand, as every other face does, and swaps in over a
         metric-matched fallback (see src/styles/fonts.css). -->
    <link
      rel="preload"
      href="/src/assets/fonts/ABCArealSuperfamilyVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/src/assets/fonts/BradfordLL-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The page is hidden until the fonts are in, so no line is ever painted
      // in a fallback face. document.fonts.ready is only meaningful once the
      // body is parsed and the faces it uses are known, so it is read then,
      // and a slow or missing face gives way to the timeout.
      ;(function () {
        const show = function () {
          document.documentElement.classList.add('fonts-ready')
        }
        if (document.fonts && document.fonts.ready) {
          document.addEventListener('DOMContentLoaded', function () {
            document.fonts.ready.then(show)
          })
          setTimeout(show, 1500)
        } else {
          show()
        }
      })()
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <!-- The chat widget itself is loaded on first interaction, see src/lib/chat-widget.ts -->
    <noscript
      ><style>
        body {
          opacity: 1 !important;
        }
      </style></noscript
    >
  </head>
  <body class="font-body text-gray-800 dark:text-gray-100 relative">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
